<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Chores Roulette</title>

    <link rel="stylesheet" href="./style.css">
</head>

<body>

    <header>
        <h1>🎯 Chores Roulette</h1>
        <button id="settingsBtn" type="button">⚙️ Settings</button>
    </header>

    <main>

        <section class="roulette-section">

            <div class="wheel-container">
                <div class="pointer"></div>

                <canvas
                    id="wheel"
                    width="500"
                    height="500"
                    aria-label="Chores roulette wheel">
                </canvas>
            </div>

            <button id="spinBtn" type="button">🎡 SPIN!</button>

            <div id="result" aria-live="polite">
                Your chore will appear here!
            </div>

        </section>

        <section class="chores-section">

            <h2>📝 Chore List</h2>

            <form id="choreForm">

                <input
                    type="text"
                    id="choreInput"
                    placeholder="Enter a chore..."
                    autocomplete="off"
                    maxlength="60"
                    required
                >

                <button id="addChoreBtn" type="submit">
                    Add Chore
                </button>

            </form>

            <ul id="choreList"></ul>

            <div class="list-buttons">
                <button id="resetBtn" type="button">🔄 Reset</button>
                <button id="clearBtn" type="button">🗑️ Clear All</button>
            </div>

        </section>

        <section id="settingsPanel" class="panel hidden">

            <h2>⚙️ Settings</h2>

            <div class="setting-row">
                <label for="darkModeToggle">🌙 Dark Mode</label>
                <input type="checkbox" id="darkModeToggle">
            </div>

            <div class="setting-row">
                <label for="soundToggle">🔊 Sound Effects</label>
                <input type="checkbox" id="soundToggle" checked>
            </div>

            <button id="closeSettingsBtn" type="button">
                Close Settings
            </button>

        </section>

        <section id="aboutPanel" class="panel">
            <h2>ℹ️ About</h2>

            <p>
                Chores Roulette makes household chores fun!
                Add your chores, spin the wheel, and let fate
                choose what you will do next.
            </p>
        </section>

    </main>

    <footer>
        <p>Made with 💜 for a more fun way to do chores!</p>
    </footer>

    <script src="./script.js"></script>

</body>
</html>
